<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok SBK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #e0edff 0%, #ffffff 50%, #e6f0ff 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* === AWAN LATAR === */
        .cloud {
            position: fixed;
            background: white;
            border-radius: 50%;
            opacity: 0.85;
            z-index: 0;
            box-shadow: 0 4px 20px rgba(100, 149, 237, 0.1);
            animation: floatCloud linear infinite;
        }
        @keyframes floatCloud {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* === HALAMAN LOGIN === */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            position: relative;
            z-index: 10;
        }

        .login-box {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .login-box h1 {
            color: #1e40af;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-box p {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #1e40af;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1e40af;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #dc2626;
            margin-top: 1rem;
            display: none;
        }

        /* === HALAMAN UTAMA === */
        .main-site {
            display: none;
            position: relative;
            z-index: 5;
        }

        /* Navbar */
        nav {
            background: rgba(30, 64, 175, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn-logout, .btn-admin, .btn-sound {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout {
            background: white;
            color: #1e40af;
        }

        .btn-logout:hover {
            background: #e2e8f0;
        }

        .btn-admin {
            background: #f59e0b;
            color: white;
            display: none;
        }

        .btn-admin.show {
            display: inline-block;
        }

        .btn-sound {
            background: #10b981;
            color: white;
        }

        .btn-sound.off {
            background: #6b7280;
        }

        /* Konten Halaman */
        .page {
            display: none;
            padding: 2rem 5%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page h2 {
            color: #1e40af;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #bfdbfe;
        }

        .card {
            background: white;
            padding: 1.8rem;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(30, 64, 175, 0.08);
            margin-bottom: 1.5rem;
            border: 1px solid #dbeafe;
        }

        .card h3 {
            color: #1e40af;
            margin-bottom: 1rem;
        }

        /* Beranda / PPT */
        .hero {
            text-align: center;
            padding: 3rem 0;
        }

        .hero h1 {
            color: #1e40af;
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: #475569;
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .ppt-frame {
            background: #f0f6ff;
            border: 2px solid #bfdbfe;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin: 2rem 0;
        }

        .ppt-frame iframe {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            border: none;
        }

        /* Anggota */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .add-member-box input, .idea-box textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #dbeafe;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: #1e40af;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .members-grid, .karya-grid, .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .member-card, .karya-card, .idea-card {
            background: white;
            padding: 1.3rem;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border-left: 4px solid #3b82f6;
        }

        .member-card h4, .karya-card h4 {
            color: #1e40af;
            margin-bottom: 0.3rem;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 0.7rem;
            cursor: pointer;
        }

        /* Grafis Desain Karya */
        .upload-area {
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: #eff6ff;
        }

        .upload-area input[type="file"] {
            margin: 1rem 0;
        }

        .idea-box textarea {
            min-height: 100px;
            resize: vertical;
            margin-bottom: 0.8rem;
        }

        .karya-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            background: #e0e7ff;
        }

        .idea-card {
            border-left-color: #10b981;
            background: #f0fdf4;
        }

        .idea-card .penulis {
            font-size: 0.85rem;
            color: #10b981;
            margin-top: 0.5rem;
        }

        /* Panel Admin / Rekap Data */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .admin-table th, .admin-table td {
            padding: 0.9rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .admin-table th {
            background: #1e40af;
            color: white;
        }

        .admin-table tr:hover {
            background: #eff6ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .angka {
            font-size: 2rem;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #1e40af;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        /* Responsif */
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.6rem; }
            .ppt-frame iframe { height: 300px; }
        }
    </style>
</head>
